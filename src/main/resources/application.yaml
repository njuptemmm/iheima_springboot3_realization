spring:
  application:
    name: demo_ai_2
  ai:
    openai:
      base-url: https://dashscope.aliyuncs.com/compatible-mode
      api-key:  ${API_KEY}
      chat:
        options:
          model:  qwen-omni-turbo
          temperature: 0.8
      embedding:
        base-url: https://dashscope.aliyuncs.com/compatible-mode
        api-key:  ${API_KEY}
        options:
          model: text-embedding-v3
          dimensions: 1024
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 生产环境请通过环境变量/密钥管理 DB_USERNAME / DB_PASSWORD，并开启 SSL
    url: jdbc:mysql://localhost:3306/itheima?serverTimezone=Asia/Shanghai&useSSL=false&useUnicode=true&characterEncoding=utf-8&zeroDateTimeBehavior=convertToNull&transformedBitIsBoolean=true&tinyInt1isBit=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      max-lifetime: 1800000
      idle-timeout: 600000
      leak-detection-threshold: 60000

app:
  pdf:
    upload-dir: uploads/pdf
  cors:
    # 生产环境请限制为前端真实域名，例如：http://localhost:5173
    allowed-origins: "*"

logging:
    level:
        org.springframework.ai: DEBUG
        com.example.demo: DEBUG
